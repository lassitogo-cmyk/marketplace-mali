<VirtualHost *:80>
    ServerName localhost
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        # -Indexes : jamais de liste des fichiers d'un dossier.
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # ---------- En-têtes de sécurité ----------
    # (setifempty : PHP en ajoute déjà pour les pages dynamiques, on ne
    #  double pas ; mais les fichiers statiques comme marche.html en ont
    #  besoin, car ils ne passent pas par PHP.)
    Header always setifempty X-Content-Type-Options "nosniff"
    Header always setifempty X-Frame-Options "DENY"
    Header always setifempty Referrer-Policy "strict-origin-when-cross-origin"
    Header always setifempty Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=()"
    Header always setifempty Cross-Origin-Opener-Policy "same-origin"
    Header always setifempty Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self'; font-src 'self' data:; manifest-src 'self'; media-src 'self'"
    Header always setifempty Strict-Transport-Security "max-age=31536000; includeSubDomains"

    # Ne jamais annoncer la technologie du serveur.
    Header unset X-Powered-By
    Header always unset X-Powered-By

    # Fichiers sensibles : refusés même s'ils se trouvaient dans public/.
    <FilesMatch "^\.(env|git|htaccess|htpasswd|DS_Store)">
        Require all denied
    </FilesMatch>

    # Fichiers volumineux (photos produits jusqu'à 4 Mo, marge incluse).
    LimitRequestBody 10485760

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
