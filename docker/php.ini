; Configuration PHP de production — Marketplace Mali
; (copiée dans /usr/local/etc/php/conf.d/ par le Dockerfile)

; Ne jamais révéler la version de PHP dans les en-têtes / erreurs.
expose_php = Off

; Erreurs : jamais affichées au visiteur (Laravel les journalise).
display_errors = Off
display_startup_errors = Off
log_errors = On
error_reporting = E_ALL & ~E_DEPRECATED

; Photos produits : 4 Mo par fichier, 10 fichiers par envoi maximum.
upload_max_filesize = 6M
post_max_size = 12M
max_file_uploads = 10
max_execution_time = 60
memory_limit = 256M

; Sessions / cookies (Sanctum utilise des jetons, pas de cookie de session).
session.cookie_httponly = 1
session.cookie_samesite = Lax
session.use_strict_mode = 1

; N'expose pas les fonctions système dans les URLs.
cgi.fix_pathinfo = 0
